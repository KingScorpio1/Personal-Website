{% extends "base.html" %}

{% block content %}
<section class="credentials-section">
    <div class="container">
        <h1 class="section-title">Professional Credentials</h1>
        <div class="cert-grid">
            {% for cert in certifications %}
            <!-- Card -->
            <div class="cert-card">
                <div class="cert-image-container">
                    {% if cert.has_dual_lang %}
                        <img src="{{ url_for('static', filename=cert.image_en) }}" class="cert-img main-img" alt="{{ cert.title }}">
                        
                        <!-- Fixed Language Toggle using data attributes -->
                        <div class="lang-toggle">
                            <button type="button" 
                                    data-img="{{ url_for('static', filename=cert.image_en) }}" 
                                    onclick="switchLang(this)" 
                                    class="active">EN</button>
                            <button type="button" 
                                    data-img="{{ url_for('static', filename=cert.image_zh) }}" 
                                    onclick="switchLang(this)">中文</button>
                        </div>
                    {% else %}
                        <img src="{{ url_for('static', filename=cert.image) }}" class="cert-img main-img" alt="{{ cert.title }}">
                    {% endif %}
                </div>
                
                <div class="cert-info">
                    <span class="cert-date">{{ cert.date }}</span>
                    <h3>{{ cert.title }}</h3>
                    <p class="issuer">{{ cert.issuer }}</p>
                    <p class="description">{{ cert.description }}</p>
                    
                    <!-- Fixed View Full Size Button -->
                    <button class="view-btn" onclick="openModal(this)">
                        <i class="fas fa-search-plus"></i> View Full Size
                    </button>
                </div>
            </div>
            {% endfor %}
        </div>
    </div>
</section>

<!-- The Modal for Full Size Images -->
<div id="imageModal" class="modal">
    <span class="close-modal" onclick="closeModal()">&times;</span>
    <img class="modal-content" id="expandedImg">
</div>

<script>
// Logic to switch EN / 中文
function switchLang(btn) {
    // Find the specific card this button belongs to
    const card = btn.closest('.cert-card');
    
    // Find the main image in this card
    const img = card.querySelector('.main-img');
    
    // Get the image URL we stored in the data-img attribute
    img.src = btn.getAttribute('data-img');

    // Update button active states
    const buttons = card.querySelectorAll('.lang-toggle button');
    buttons.forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
}

// Logic to open modal with the currently displayed image
function openModal(btn) {
    // Find the card to grab whichever image is currently visible
    const card = btn.closest('.cert-card');
    const activeImgSrc = card.querySelector('.main-img').src;
    
    const modal = document.getElementById("imageModal");
    const modalImg = document.getElementById("expandedImg");
    
    modal.style.display = "flex";
    modalImg.src = activeImgSrc;
}

// Logic to close modal
function closeModal() {
    document.getElementById("imageModal").style.display = "none";
}

// Close modal if user clicks outside the image
window.onclick = function(event) {
    const modal = document.getElementById("imageModal");
    if (event.target == modal) {
        modal.style.display = "none";
    }
}
</script>

<style>
    .credentials-section {
        padding: 100px 20px;
        min-height: 100vh;
    }

    .section-title { text-align: center; font-size: 2.5rem; margin-bottom: 50px; color: #fff;}

    .cert-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
        gap: 30px;
        max-width: 1200px;
        margin: 0 auto;
    }

    .cert-card {
        background: rgba(255, 255, 255, 0.05);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 15px;
        overflow: hidden;
        transition: transform 0.3s ease, box-shadow 0.3s ease;
        display: flex;
        flex-direction: column;
    }

    .cert-card:hover {
        transform: translateY(-5px);
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        border: 1px solid rgba(255, 255, 255, 0.3);
    }

    .cert-image-container {
        width: 100%;
        height: 220px;
        position: relative;
        background: #111; 
    }

    .cert-image-container img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: top;
        opacity: 0.8;
        transition: opacity 0.3s;
    }

    .cert-card:hover img { opacity: 1; }

    /* Language Toggle styling */
    .lang-toggle {
        position: absolute;
        bottom: 10px;
        right: 10px;
        display: flex;
        gap: 5px;
        background: rgba(0, 0, 0, 0.7);
        padding: 5px;
        border-radius: 8px;
        backdrop-filter: blur(5px);
    }

    .lang-toggle button {
        background: transparent;
        border: none;
        color: #fff;
        padding: 5px 10px;
        cursor: pointer;
        font-size: 0.8rem;
        font-weight: bold;
        border-radius: 4px;
        transition: 0.3s;
    }

    .lang-toggle button.active {
        background: #00d4ff;
        color: #000;
    }

    .cert-info { 
        padding: 25px; 
        flex-grow: 1;
        display: flex;
        flex-direction: column;
    }

    .cert-date {
        font-size: 0.85rem;
        color: #00d4ff;
        text-transform: uppercase;
        letter-spacing: 1px;
    }

    .cert-info h3 { margin: 10px 0 5px 0; font-size: 1.3rem; color: #fff;}
    .issuer { font-weight: bold; color: #eee; margin-bottom: 15px; font-size: 0.95rem;}
    .description { font-size: 0.9rem; color: #aaa; line-height: 1.6; margin-bottom: 25px; flex-grow: 1;}

    /* View Button Styling */
    .view-btn {
        padding: 10px 0;
        width: 100%;
        background: rgba(0, 212, 255, 0.1);
        border: 1px solid rgba(0, 212, 255, 0.3);
        color: #00d4ff;
        border-radius: 5px;
        font-size: 1rem;
        cursor: pointer;
        transition: 0.3s;
        text-align: center;
    }

    .view-btn:hover {
        background: #00d4ff;
        color: #000;
    }

    /* Modal Styles */
    .modal {
        display: none; 
        position: fixed; 
        z-index: 1000; 
        left: 0;
        top: 0;
        width: 100%; 
        height: 100%; 
        background-color: rgba(0,0,0,0.9); 
        align-items: center;
        justify-content: center;
        backdrop-filter: blur(5px);
    }

    .modal-content {
        max-width: 90%;
        max-height: 90vh;
        border-radius: 8px;
        box-shadow: 0 0 30px rgba(0,0,0,0.8);
        animation: zoomIn 0.3s ease;
    }

    .close-modal {
        position: absolute;
        top: 20px;
        right: 35px;
        color: #f1f1f1;
        font-size: 40px;
        font-weight: bold;
        cursor: pointer;
        transition: 0.3s;
    }

    .close-modal:hover { color: #00d4ff; }

    @keyframes zoomIn {
        from {transform:scale(0.9); opacity:0}
        to {transform:scale(1); opacity:1}
    }
</style>
{% endblock %}
